{% extends "base.html" %}

{% block title %}Edit Expense — Spendly{% endblock %}

{% block content %}

<section class="auth-section">
    <div class="auth-container">

        <div class="auth-header">
            <h1 class="auth-title">Edit expense</h1>
            <p class="auth-subtitle">Update a spending entry</p>
        </div>

        <div class="auth-card">
            {% if error %}
            <div class="auth-error">{{ error }}</div>
            {% endif %}

            <form method="POST" action="{{ url_for('edit_expense', id=expense.id) }}">
                <div class="form-group">
                    <label for="amount">Amount</label>
                    <input type="number" id="amount" name="amount"
                           class="form-input" placeholder="0.00"
                           step="0.01" min="0.01"
                           value="{{ amount }}" required autofocus>
                </div>
                <div class="form-group">
                    <label for="category">Category</label>
                    <select id="category" name="category" class="form-input" required>
                        <option value="" disabled {{ 'selected' if not category else '' }}>Select a category</option>
                        {% for cat in categories %}
                        <option value="{{ cat }}" {{ 'selected' if category == cat else '' }}>{{ cat }}</option>
                        {% endfor %}
                    </select>
                </div>
                <div class="form-group">
                    <label for="date">Date</label>
                    <input type="date" id="date" name="date"
                           class="form-input"
                           value="{{ date }}" required>
                </div>
                <div class="form-group">
                    <label for="description">Description <span style="color: var(--ink-muted); font-weight: 400;">(optional)</span></label>
                    <textarea id="description" name="description"
                              class="form-input" rows="2" maxlength="500"
                              placeholder="e.g. Weekly grocery run">{{ description }}</textarea>
                </div>
                <button type="submit" class="btn-submit">Save changes</button>
            </form>
        </div>

        <p class="auth-switch">
            <a href="{{ url_for('profile') }}" class="btn-ghost" style="display: inline-block;">Cancel</a>
        </p>

    </div>
</section>

{% endblock %}
